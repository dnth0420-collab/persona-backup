<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Persona Vault - 캐릭터 백업 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151c2c',
                            900: '#0b0f19',
                            950: '#05070c',
                        },
                        accent: {
                            blue: '#2563eb',
                            cyan: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white custom-scrollbar">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-brain text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                        Persona Vault <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-cyan-400 border border-blue-500/20">Backup v2.2</span>
                    </h1>
                    <p class="text-xs text-slate-400">AI 캐릭터 및 프롬프트 안전 백업 아카이브</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openAddModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition shadow-lg shadow-blue-600/20 active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">새 캐릭터 등록</span>
                </button>
                <button onclick="exportData()" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-sm transition border border-slate-700/50" title="모든 데이터 백업 (JSON)">
                    <i class="fa-solid fa-download text-cyan-400"></i>
                    <span class="hidden md:inline">백업(JSON)</span>
                </button>
                <label class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-sm transition border border-slate-700/50 cursor-pointer" title="백업 파일 복원">
                    <i class="fa-solid fa-upload text-blue-400"></i>
                    <span class="hidden md:inline">복원</span>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Search & Filter Bar -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterPersonas()" placeholder="캐릭터 이름, 태그, 설명 검색..." 
                    class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
            </div>
            
            <div id="tagFilterContainer" class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 custom-scrollbar">
                <button onclick="filterByTag('all')" class="tag-btn px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 text-white transition whitespace-nowrap shadow-sm" data-tag="all">전체보기</button>
            </div>
        </div>

        <!-- Persona Grid -->
        <div id="personaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamically Rendered Cards -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 rounded-2xl bg-slate-800/50 border border-slate-700 flex items-center justify-center text-slate-600 text-3xl mb-4">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300 mb-1">저장된 캐릭터가 없습니다</h3>
            <p class="text-sm text-slate-500 mb-6">새로운 AI 페르소나를 등록하거나 JSON 백업 파일을 불러와보세요.</p>
            <button onclick="openAddModal()" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition">
                첫 페
